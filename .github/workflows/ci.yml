name: Native macOS checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      focused_launch_services:
        description: Run only the real disposable LaunchServices receiver test on macOS 15
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  check:
    runs-on: macos-15
    env:
      # Explicit per-job selection; does not modify the host's Developer Directory.
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Verify selected native toolchain
        run: |
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
          xcrun swift --version
          xcodebuild -showsdks
      - name: Audit repository candidates and index
        run: |
          python3 scripts/audit-baseline.py
          python3 scripts/audit-baseline.py --staged
      - name: Compile, test, and build app bundles
        if: ${{ !inputs.focused_launch_services }}
        run: ./scripts/check.sh --require-xctest
      - name: Focused LaunchServices receiver
        if: ${{ inputs.focused_launch_services }}
        run: |
          export CLANG_MODULE_CACHE_PATH="$PWD/build/cache/clang"
          export SWIFTPM_MODULECACHE_OVERRIDE="$CLANG_MODULE_CACHE_PATH"
          export SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
          swift test --disable-sandbox --cache-path "$PWD/build/cache/swiftpm" \
            --sdk "$SDKROOT" -Xlinker -platform_version -Xlinker macos -Xlinker 14.0 \
            -Xlinker "$(xcrun --sdk macosx --show-sdk-version)" \
            --filter P0LaunchTests/testLaunchServicesReturnsExactSyntheticReceiverAndPassesBothRoots
      - name: Build universal SwiftPM bundle
        if: ${{ !inputs.focused_launch_services }}
        run: |
          ./scripts/build-app.sh release universal
          python3 scripts/check-project.py --bundle build/release-universal/CodexSwoop.app
          swift scripts/check-icons.swift --bundle build/release-universal/CodexSwoop.app
      - name: Check UI rendering and icon payload
        if: ${{ !inputs.focused_launch_services }}
        run: |
          ./scripts/check-account-setup-ui.sh
          ./scripts/check-usage-ui.sh
          swift scripts/check-icons.swift --bundle build/release/CodexSwoop.app
